name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ── JOB 1 : Tests ──────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Cache Maven
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

    - name: Run tests
      run: mvn clean test

    - name: Publish test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: target/surefire-reports/

  # ── JOB 2 : Build & Push Docker ────────
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build et Push image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          sambasy/devops-app:latest
          sambasy/devops-app:${{ github.sha }}

  # ── JOB 3 : Update infra repo ──────────
  update-infra:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Checkout devops-infra
      uses: actions/checkout@v4
      with:
        repository: sneybe/devops-infra
        token: ${{ secrets.GH_TOKEN }}

    - name: Update image tag
      run: |
        sed -i 's|tag:.*|tag: "${{ github.sha }}"|g' \
          helm/values.yaml
        git config user.email "ci@github.com"
        git config user.name "GitHub Actions"
        git add helm/values.yaml
        git commit -m "deploy: devops-app → ${{ github.sha }}"
        git push
